<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Rodericks</title>
<style>
    * { margin: 0; padding: 0; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const TEXT = "I Love You Rodericks ";
const POINTS = 180; // titik per layer. dikit = ga lag + ga numpuk
const LAYERS = 12;  // jumlah layer jantung
let time = 0;

function draw() {
  // efek trail tipis
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(0, 0, w, h);

  ctx.font = "bold 10px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ff2d55";
  // MATIIN shadow biar teks ga nyatu
  ctx.shadowBlur = 0; 

  const cx = w / 2;
  const cy = h / 2;

  for(let layer = 0; layer < LAYERS; layer++) {
    const layerScale = 10 + layer * 1.1; // ukuran tiap layer
    const layerAlpha = 1 - layer * 0.07; // layer belakang transparan
    
    ctx.globalAlpha = layerAlpha;

    for(let i = 0; i < POINTS; i++) {
      const angle = (i / POINTS) * Math.PI * 2;
      
      // Rumus bentuk jantung 2D
      const x = 16 * Math.pow(Math.sin(angle), 3);
      const y = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle);
      
      // KUNCI: wave naik turun gantian
      // time + angle*4 + layer*0.5 = tiap titik beda waktunya
      const wave = Math.sin(time + angle * 4 + layer * 0.5) * 4;
      
      const posX = cx + x * layerScale;
      const posY = cy - y * layerScale + wave;

      ctx.fillText(TEXT, posX, posY);
    }
  }
  
  ctx.globalAlpha = 1;
  time += 0.035; // kecepatan gelombang
  requestAnimationFrame(draw);
}

draw();

// responsive
window.addEventListener('resize', () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
