<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Rodericks</title>
<style>
    * { margin: 0; padding: 0; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const TEXT = "I Love You Rodericks ";
const TOTAL_POINTS = 360; // jumlah teks di bentuk jantung. 360 = pas 1 putaran
let time = 0;

function draw() {
  // background + efek trail
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, w, h);

  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ff2d55";
  ctx.shadowBlur = 0; // biar ga numpuk blur

  const cx = w / 2;
  const cy = h / 2;
  const scale = 12; // ukuran jantung

  for(let i = 0; i < TOTAL_POINTS; i++) {
    const angle = (i / TOTAL_POINTS) * Math.PI * 2;
    
    // Rumus jantung 2D
    const x = 16 * Math.pow(Math.sin(angle), 3);
    const y = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle);
    
    // KUNCI: tiap titik naik turun beda waktu 
    // angle * 5 = biar gelombangnya jalan muter
    const wave = Math.sin(time + angle * 5) * 4;
    
    const posX = cx + x * scale;
    const posY = cy - y * scale + wave;

    ctx.fillText(TEXT, posX, posY);
  }
  
  time += 0.04; // kecepatan gelombang
  requestAnimationFrame(draw);
}

draw();

// biar responsive
window.addEventListener('resize', () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
