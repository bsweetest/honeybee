<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Rodericks</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    perspective: 1000px;
  }

  .heart {
    position: relative;
    width: 100px;
    height: 100px;
    transform-style: preserve-3d;
    animation: rotate 20s linear infinite;
  }

  @keyframes rotate {
    0% { transform: rotateX(-20deg) rotateY(0deg); }
    100% { transform: rotateX(-20deg) rotateY(360deg); }
  }

  .text {
    position: absolute;
    color: #ff4d6d;
    font: bold 14px Arial;
    text-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff4d6d;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="heart" id="heart"></div>

<script>
const heart = document.getElementById('heart');
const text = "I Love You Rodericks ";
const layers = 15; // jumlah layer jantung
const points = 80; // jumlah teks per layer

for(let l = 0; l < layers; l++) {
  for(let i = 0; i < points; i++) {
    const angle = (i / points) * Math.PI * 2;
    
    // rumus jantung 3D
    const x = 16 * Math.pow(Math.sin(angle), 3);
    const y = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle);
    const z = l * 8 - 60; // bikin tebel ke belakang
    
    const span = document.createElement('span');
    span.className = 'text';
    span.innerText = text;
    span.style.transform = `translate3d(${x * 10}px, ${-y * 10}px, ${z}px) rotateY(${angle}rad)`;
    span.style.animation = `wave 2s ease-in-out infinite`;
    span.style.animationDelay = `${i * 0.01 + l * 0.05}s`; // ini bikin naik turun gantian
    
    heart.appendChild(span);
  }
}

// animasi naik turun
const style = document.createElement('style');
style.innerHTML = `
@keyframes wave {
  0%, 100% { transform: translateZ(0px); }
  50% { transform: translateZ(15px); }
}`;
document.head.appendChild(style);
</script>
</body>
</html>
